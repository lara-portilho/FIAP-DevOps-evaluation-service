name: CI & DevSecOps - Evaluation Service

# Define quando o pipeline será disparado (em push ou pull request na branch principal)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Define o ambiente de execução (máquina virtual Ubuntu)

    steps:
      # 1. Baixa o código do repositório para a máquina virtual
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Go na versão especificada
      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # 3. Executa os testes unitários da aplicação em Go
      - name: Executar Testes Unitários
        run: go test -v ./...

      # 4. Realiza a análise estática de código (Linter do Go)
      - name: Análise Estática de Código (Go Vet)
        run: go vet ./...

      # 5. Executa o Scanner de Segurança (SAST/SCA) no código fonte usando o Trivy
      - name: Security Scan (SAST & SCA com Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1' # Interrompe o pipeline se encontrar vulnerabilidades críticas ou altas
          severity: 'CRITICAL,HIGH'

      # 6. Configura as credenciais de acesso à AWS usando os segredos do repositório
      - name: Configurar Credenciais da AWS (ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 7. Realiza o login autenticado no registro de containers da AWS (Amazon ECR)
      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Constrói a imagem Docker do microsserviço utilizando o hash do commit e a tag latest
      - name: Build da Imagem Docker
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: evaluation-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .

      # 9. Realiza um novo Scan de Segurança na imagem Docker recém-criada
      - name: Security Scan na Imagem Docker (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/evaluation-service:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Bloqueia o envio se a imagem contiver vulnerabilidades graves
          severity: 'CRITICAL,HIGH'

      # 10. Envia (Push) a imagem validada para o repositório do Amazon ECR
      - name: Push da Imagem para o Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: evaluation-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest
